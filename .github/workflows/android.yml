
name: Build Hubbu Batulu Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'songs.json'
      - '*.mp3'
      - '*.png'

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Get website files
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Create Android project
        run: |
          mkdir -p app/src/main/java/com/hubbubatulu/music
          mkdir -p app/src/main/assets/www

          cp index.html app/src/main/assets/www/
          cp songs.json app/src/main/assets/www/
          cp service-worker.js app/src/main/assets/www/ || true
          cp ./*.mp3 app/src/main/assets/www/ 2>/dev/null || true
          cp ./*.png app/src/main/assets/www/ 2>/dev/null || true
          cp manifest.json app/src/main/assets/www/ || true

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HubbuBatulu"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hubbubatulu.music'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.hubbubatulu.music'
                  minSdk 24
                  targetSdk 28
                  versionCode 2
                  versionName '2.0'
          }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="HUBBU BATULU GROUP MUSICS">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hubbubatulu/music/MainActivity.java <<'EOF'
          package com.hubbubatulu.music;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.view.KeyEvent;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setAllowContentAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);
                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hubbu-Batulu-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
