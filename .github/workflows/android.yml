
name: Build Hubbu Batulu Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'songs.json'
      - '*.mp3'
      - '*.png'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '7.6.4'

      - name: Prepare offline website
        run: |
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/java/com/hubbubatulu/music

          cp index.html app/src/main/assets/www/index.html

          python3 - <<'PY'
          import os, json, glob, shutil
          from urllib.parse import unquote

          dest = "app/src/main/assets/www"

          with open("songs.json", encoding="utf-8") as f:
              original = json.load(f)

          songs = []

          for song in original:
              audio = unquote(song.get("audio", ""))
              filename = os.path.basename(audio)

              if not filename or not os.path.isfile(filename):
                  raise SystemExit("MP3 not found: " + filename)

              shutil.copy2(filename, os.path.join(dest, filename))

              songs.append({
                  "title": song.get("title", filename),
                  "artist": song.get("artist", "HUBBU BATULU GROUP"),
                  "group": song.get("group", "HUBBU BATULU GROUP"),
                  "audio": filename
              })

          if not songs:
              raise SystemExit("No songs found in songs.json")

          with open(os.path.join(dest, "songs-data.js"), "w", encoding="utf-8") as f:
              f.write("window.HUBBU_SONGS = ")
              json.dump(songs, f, ensure_ascii=False)
              f.write(";")

          logo = "file_000000000ff8820bb7b71d6099faa4a3.png"

          if not os.path.isfile(logo):
              raise SystemExit("Group logo not found!")

          shutil.copy2(logo, os.path.join(dest, "logo.png"))

          print("Songs included:", len(songs))
          print("Logo included successfully")
          PY

          python3 - <<'PY'
          path = "app/src/main/assets/www/index.html"
          with open(path, encoding="utf-8") as f:
              html = f.read()

          html = html.replace(
              'src="file_000000000ff8820bb7b71d6099faa4a3.png"',
              'src="logo.png"'
          )

          start = html.find("<script>")
          end = html.find("</script>", start)

          if start < 0 or end < 0:
              raise SystemExit("Could not locate original page script")

          replacement = """<script src="songs-data.js"></script>
          <script>
          const songs = window.HUBBU_SONGS || [];
          const area = document.getElementById("songs");
          const status = document.getElementById("status");

          status.textContent = "Waƙoƙin da ke cikin app ɗin";
          area.innerHTML = "";

          if (!songs.length) {
            area.textContent = "Babu waƙa a yanzu.";
          }

          songs.forEach(song => {
            const box = document.createElement("div");
            box.className = "song";

            const title = document.createElement("h3");
            title.textContent = song.title;

            const artist = document.createElement("p");
            artist.textContent = "Mawaƙi: " + song.artist;

            const group = document.createElement("p");
            group.textContent = "Ƙungiya: " + song.group;

            const player = document.createElement("audio");
            player.controls = true;
            player.preload = "none";
            player.src = encodeURIComponent(song.audio);

            box.append(title, artist, group, player);
            area.appendChild(box);
          });
          </script>"""

          html = html[:start] + replacement + html[end + len("</script>"):]

          with open(path, "w", encoding="utf-8") as f:
              f.write(html)
          PY

      - name: Create Android project
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HubbuBatulu"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hubbubatulu.music'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.hubbubatulu.music'
                  minSdk 24
                  targetSdk 28
                  versionCode 4
                  versionName '4.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:label="HUBBU BATULU GROUP MUSICS">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hubbubatulu/music/MainActivity.java <<'EOF'
          package com.hubbubatulu.music;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.view.KeyEvent;

          public class MainActivity extends Activity {
              WebView web;

              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  web.setWebViewClient(new WebViewClient());
                  setContentView(web);
                  web.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public boolean onKeyDown(int keyCode, KeyEvent event) {
                  if (keyCode == KeyEvent.KEYCODE_BACK && web.canGoBack()) {
                      web.goBack();
                      return true;
                  }
                  return super.onKeyDown(keyCode, event);
              }
          }
          EOF

      - name: Build APK
        run: gradle assembleDebug

      - name: Verify APK
        run: |
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hubbu-Batulu-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          
