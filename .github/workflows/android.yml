
name: Build Hubbu Batulu Offline APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/android.yml'
      - 'index.html'
      - 'songs.json'
      - '*.mp3'
      - '*.png'

permissions:
  contents: read

jobs:
  build:
    name: Build Offline Android APK
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - name: Set up Gradle without cache
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 7.6.4
          cache-disabled: true

      - name: Prepare offline music and website
        shell: bash
        run: |
          mkdir -p app/src/main/assets/www
          mkdir -p app/src/main/java/com/hubbubatulu/music

          python3 - <<'PY'
          import os, json, shutil, re
          from pathlib import Path
          from urllib.parse import unquote

          root = Path(".")
          web = Path("app/src/main/assets/www")
          web.mkdir(parents=True, exist_ok=True)

          html_path = root / "index.html"
          if not html_path.exists():
              raise SystemExit("index.html bai samu ba")

          html = html_path.read_text(encoding="utf-8")

          logo = root / "file_000000000ff8820bb7b71d6099faa4a3.png"
          if not logo.exists():
              raise SystemExit("Tsohon logo bai samu ba")

          shutil.copy2(logo, web / "logo.png")

          songs_file = root / "songs.json"
          songs = json.loads(songs_file.read_text(encoding="utf-8")) if songs_file.exists() else []

          mp3_files = sorted(root.glob("*.mp3"))
          if not mp3_files:
              raise SystemExit("Ba a samu MP3 ba")

          final_songs = []
          used = set()

          for song in songs:
              audio = unquote(str(song.get("audio", "")))
              wanted = Path(audio).name
              match = next((p for p in mp3_files if p.name.lower() == wanted.lower()), None)

              if match:
                  final_songs.append({
                      "title": song.get("title") or match.stem,
                      "artist": song.get("artist") or "HUBBU BATULU GROUP",
                      "group": song.get("group") or "HUBBU BATULU GROUP",
                      "audio": match.name
                  })
                  used.add(match.name)

          for mp3 in mp3_files:
              if mp3.name not in used:
                  final_songs.append({
                      "title": mp3.stem,
                      "artist": "HUBBU BATULU GROUP",
                      "group": "HUBBU BATULU GROUP",
                      "audio": mp3.name
                  })

          for mp3 in mp3_files:
              shutil.copy2(mp3, web / mp3.name)

          data = json.dumps(final_songs, ensure_ascii=False)
          js = """
          window.HUBBU_SONGS = """ + data + """;
          const area = document.getElementById("songs");
          const status = document.getElementById("status");
          status.textContent = "Waƙoƙi suna cikin wayarka — Offline.";
          area.innerHTML = "";
          for (const song of window.HUBBU_SONGS) {
            const box = document.createElement("div");
            box.className = "song";
            const title = document.createElement("h3");
            title.textContent = song.title;
            const artist = document.createElement("p");
            artist.textContent = "Mawaƙi: " + song.artist;
            const group = document.createElement("p");
            group.textContent = "Ƙungiya: " + song.group;
            const player = document.createElement("audio");
            player.controls = true;
            player.preload = "metadata";
            player.src = "./" + encodeURIComponent(song.audio).replace(/'/g, "%27");
            box.append(title, artist, group, player);
            area.append(box);
          }
          if (!window.HUBBU_SONGS.length) {
            area.textContent = "Babu waƙa a yanzu.";
          }
          """

          html = html.replace(
              'src="file_000000000ff8820bb7b71d6099faa4a3.png"',
              'src="logo.png"'
          )

          html = re.sub(
              r'<script>.*?</script>',
              '<script>' + js + '</script>',
              html,
              count=1,
              flags=re.S
          )

          (web / "index.html").write_text(html, encoding="utf-8")
          print("An shirya waƙoƙi:", len(final_songs))
          PY

      - name: Create Android project
        shell: bash
        run: |
          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "HubbuBatuluMusic"
          include ':app'
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '7.4.2' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.hubbubatulu.music'
              compileSdk 33

              defaultConfig {
                  applicationId 'com.hubbubatulu.music'
                  minSdk 24
                  targetSdk 28
                  versionCode 5
                  versionName '5.0'
              }
          }
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="HUBBU BATULU GROUP MUSICS"
                  android:theme="@android:style/Theme.Material.Light.NoActionBar"
                  android:usesCleartextTraffic="false">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/hubbubatulu/music/MainActivity.java <<'EOF'
          package com.hubbubatulu.music;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebSettings;
          import android.webkit.WebView;

          public class MainActivity extends Activity {
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  WebView web = new WebView(this);
                  WebSettings settings = web.getSettings();
                  settings.setJavaScriptEnabled(true);
                  settings.setDomStorageEnabled(true);
                  settings.setAllowFileAccess(true);
                  settings.setMediaPlaybackRequiresUserGesture(false);

                  setContentView(web);
                  web.loadUrl("file:///android_asset/www/index.html");
              }

              @Override
              public void onBackPressed() {
                  super.onBackPressed();
              }
          }
          EOF

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Check APK
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Hubbu-Batulu-Offline-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
          
